    class WebAudioFX {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      }

      playTone(freq, type, duration, gainVal = 0.12) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) { console.warn("Audio error", e); }
      }

      submitPop() {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.1), idx * 50);
        });
      }

      starFanfare() {
        [1046.50, 1318.51, 1567.98, 2093.00, 2637.02].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.3, 0.14), idx * 45);
        });
      }

      spotlightChime() {
        this.playTone(880, 'sine', 0.2, 0.1);
        setTimeout(() => this.playTone(1318.51, 'sine', 0.25, 0.12), 80);
      }

      wordChange() {
        this.playTone(392.00, 'triangle', 0.1, 0.08);
        setTimeout(() => this.playTone(523.25, 'sine', 0.2, 0.12), 70);
      }
    }

      async init() {

      async setupFirebase() {
        try {
          // Initialize Firebase
          this.firebaseApp = initializeApp(firebaseConfig);
          this.db = getFirestore(this.firebaseApp);
          this.auth = getAuth(this.firebaseApp);

          // Isolate Auth attempts so token mismatches do not block Firestore sync
          try {
            const userCred = await signInAnonymously(this.auth);
            this.currentUser = userCred.user;
          } catch (anonErr) {
            console.warn("Anonymous auth note:", anonErr?.message || anonErr);
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              try {
                const userCred = await signInWithCustomToken(this.auth, __initial_auth_token);
                this.currentUser = userCred.user;
              } catch (tokenErr) {
                console.warn("Custom token auth note:", tokenErr?.message || tokenErr);
              }
            }
          }

          this.isOnline = true;
          this.updateConnPill(true, "🟢 Live Sync: spelling-review-13bdb");
          console.log("Firebase initialized successfully. User:", this.currentUser?.uid || "Unauthenticated Sync");
        } catch (err) {
          console.error("Firebase setup failed:", err);
          this.isOnline = false;
          this.updateConnPill(false, "🔴 Offline Mode");
        }
      }

      updateConnPill(online, text) {
        const dot = document.getElementById('conn-dot');
        const textEl = document.getElementById('conn-text');
        if (dot) {
          dot.className = online ? "w-2.5 h-2.5 rounded-full bg-emerald-400" : "w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse";

      subscribeToRoom(roomCode) {
        if (this.unsubscribeRoom) this.unsubscribeRoom();
        if (this.unsubscribeSubmissions) this.unsubscribeSubmissions();

        this.roomCode = roomCode.toUpperCase().trim();
        localStorage.setItem('spelling_room_code', this.roomCode);

        document.getElementById('header-room-id').innerText = this.roomCode;
        document.getElementById('header-room-badge').classList.remove('hidden');

        if (!this.isOnline || !this.db) return;

        // MANDATORY RULE 1: Strict Paths
        // Path: /artifacts/{appId}/public/data/spelling_rooms/{roomCode}
        const roomDocRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'spelling_rooms', this.roomCode);

        // Listener for Room State with Mandatory Error Callback
        this.unsubscribeRoom = onSnapshot(roomDocRef, (docSnap) => {
          if (docSnap.exists()) {
            this.roomData = docSnap.data();
            this.renderCurrentMode();
          } else if (this.mode === 'tv') {
            // Teacher initializes room document
            this.saveRoomData();
          }
        }, (error) => {
          console.error("Room listener error:", error);
        });

        // MANDATORY RULE 2: Fetch simple collection & filter in JS memory
        // Path: /artifacts/{appId}/public/data/spelling_submissions
        const subColRef = collection(this.db, 'artifacts', appId, 'public', 'data', 'spelling_submissions');

        this.unsubscribeSubmissions = onSnapshot(subColRef, (snapshot) => {
          const rawDocs = [];
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            data.id = docSnap.id;
            // JS Memory filter by roomCode per RULE 2
            if (data.roomCode === this.roomCode) {
              rawDocs.push(data);
            }
          });

          // Sort descending by creation timestamp
          rawDocs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          const prevCount = this.submissions.length;
          this.submissions = rawDocs;

          if (rawDocs.length > prevCount && prevCount > 0) {
            audio.submitPop();
          }

          if (this.mode === 'tv') {
            this.renderTVSubmissions();
          } else if (this.mode === 'student') {
            this.renderStudentStatus();
          }
        }, (error) => {
          console.error("Submissions listener error:", error);
        });
      }

      async saveRoomData() {
        if (!this.isOnline || !this.db) return;
        try {
          const roomDocRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'spelling_rooms', this.roomCode);
          await setDoc(roomDocRef, {
            ...this.roomData,
            roomCode: this.roomCode,
            updatedAt: Date.now()
          }, { merge: true });
        } catch (e) {
          console.error("Error saving room data:", e);
        }
      }

      updateStudentTargetWord() {
        const wordEl = document.getElementById('student-target-word');
        const hintEl = document.getElementById('student-target-hint');
        if (wordEl) wordEl.innerText = this.roomData.activeWord;
        if (hintEl) hintEl.innerText = `"${this.roomData.wordHint || 'Write a funny sentence incorporating this word!'}"`;
        this.validateStudentInput();
      }

      studentSelectWord(word) {
        this.roomData.activeWord = word;
        const found = (this.roomData.wordList || []).find(w => w.word.toLowerCase() === word.toLowerCase());
        this.roomData.wordHint = found ? found.hint : '';
        this.updateStudentTargetWord();
      }

      validateStudentInput() {
        const input = document.getElementById('student-sentence-input');
        const badge = document.getElementById('target-word-checker-badge');
        const submitBtn = document.getElementById('student-submit-btn');

        if (!input || !badge || !submitBtn) return;

        const text = input.value;
        const target = (this.roomData.activeWord || '').trim();

        if (!target) return;

        const regex = new RegExp(`\\b${this.escapeRegExp(target)}\\b`, 'i');
        const containsWord = regex.test(text);

        if (containsWord) {
          badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 animate-pop-in";
          badge.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 mr-1"></i> Target Word Included!`;
          
          submitBtn.disabled = false;
          submitBtn.className = "w-full py-4 bg-gradient-to-r from-brand-500 via-brand-600 to-accent-purple hover:opacity-95 text-white font-display font-bold text-lg rounded-2xl shadow-xl shadow-brand-500/30 transition-all active:scale-[0.98] flex items-center justify-center space-x-2 cursor-pointer";
        } else {
          badge.className = "text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700";
          badge.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-400 mr-1"></i> Include word: "${target}"`;

          submitBtn.disabled = true;
          submitBtn.className = "w-full py-4 bg-slate-800 text-slate-500 font-display font-bold text-lg rounded-2xl shadow-xl transition-all flex items-center justify-center space-x-2 cursor-not-allowed";
        }
      }

      async submitStudentSentence() {
        const input = document.getElementById('student-sentence-input');
        if (!input) return;

        const sentence = input.value.trim();
        if (!sentence) return;

        audio.submitPop();
        this.triggerConfetti();

        const submissionData = {
          roomCode: this.roomCode,
          studentName: this.studentName,
          avatar: this.studentAvatar,
          word: this.roomData.activeWord,
          sentence: sentence,
          starred: false,
          reactions: { '😂': 0, '🌟': 0, '🧠': 0, '🎨': 0 },
          createdAt: Date.now()
        };

        if (this.isOnline && this.db) {
          try {
            // Path: /artifacts/{appId}/public/data/spelling_submissions
            const colRef = collection(this.db, 'artifacts', appId, 'public', 'data', 'spelling_submissions');
            await addDoc(colRef, submissionData);
          } catch (e) {
            console.error("Error submitting sentence to Firestore:", e);
          }
        } else {
          // Local fallback
          this.submissions.unshift({ ...submissionData, id: 'sub_' + Date.now() });
          this.renderStudentStatus();
        }

        input.value = '';
        this.validateStudentInput();
        this.showToast("Sentence sent directly to TV Screen! 🎉", "success");
      }

      renderStudentStatus() {
        const preview = document.getElementById('student-status-preview');
        if (!preview) return;

        const mySubmissions = this.submissions.filter(s => s.studentName === this.studentName);

        if (mySubmissions.length === 0) {
          preview.innerHTML = ``;
          return;
        }

        preview.innerHTML = `
          <div class="mt-4 border-t border-slate-800/80 pt-3">
            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">My TV Showcase Submissions (${mySubmissions.length})</p>
            <div class="space-y-2 max-h-36 overflow-y-auto">
              ${mySubmissions.map(s => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs flex justify-between items-center">
                  <p class="text-slate-200 font-medium italic truncate mr-2">"${s.sentence}"</p>
                  <div class="flex items-center space-x-2 shrink-0">
                    ${s.starred ? `
                      <span class="text-amber-400 font-bold flex items-center bg-amber-400/10 px-2 py-0.5 rounded border border-amber-400/30">

                      </span>
                    ` : `
                      <span class="text-emerald-400 font-semibold">On TV</span>
                    `}
                    <button onclick="app.deleteSubmission('${s.id}')" class="text-slate-500 hover:text-rose-400 p-1">
                      <i class="fa-solid fa-trash"></i>
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      async cycleNextWord() {
        const list = this.roomData.wordList || SPELLING_PRESETS["Grade 4/5 Tricky Words"];
        let nextIndex = (this.roomData.currentWordIndex || 0) + 1;
        if (nextIndex >= list.length) nextIndex = 0;

        const nextObj = list[nextIndex];
        this.roomData.activeWord = nextObj.word;
        this.roomData.wordHint = nextObj.hint || '';
        this.roomData.currentWordIndex = nextIndex;

        audio.wordChange();
        await this.saveRoomData();
        this.renderCurrentMode();
        this.showToast(`Switched target word to "${nextObj.word.toUpperCase()}"!`, "info");
      }

      async toggleAnonymous() {
        this.roomData.isAnonymous = !this.roomData.isAnonymous;
        await this.saveRoomData();
        this.renderCurrentMode();
      }

      async toggleMasked() {
        this.roomData.isMasked = !this.roomData.isMasked;
        await this.saveRoomData();
        this.renderCurrentMode();
      }

      async addReaction(subId, emoji) {
        audio.wordChange();
        const sub = this.submissions.find(s => s.id === subId);
        if (!sub) return;

        const reactions = sub.reactions || { '😂': 0, '🌟': 0, '🧠': 0, '🎨': 0 };
        reactions[emoji] = (reactions[emoji] || 0) + 1;

        if (this.isOnline && this.db) {
          try {
            const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'spelling_submissions', subId);
            await updateDoc(docRef, { reactions });
          } catch(e) { console.error("Error updating reaction:", e); }
        } else {
          sub.reactions = reactions;
          this.renderTVSubmissions();
        }
      }

      async toggleStarSubmission(subId, starState) {
        if (starState) {
          audio.starFanfare();
          this.triggerConfetti();
        }

        if (this.isOnline && this.db) {
          try {
            const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'spelling_submissions', subId);
            await updateDoc(docRef, { starred: starState });
          } catch(e) { console.error("Error starring doc:", e); }
        } else {
          const sub = this.submissions.find(s => s.id === subId);
          if (sub) sub.starred = starState;
          this.renderTVSubmissions();
        }
      }

      async deleteSubmission(subId) {
        if (this.isOnline && this.db) {
          try {
            const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'spelling_submissions', subId);
            await deleteDoc(docRef);
          } catch(e) { console.error("Error deleting doc:", e); }
        } else {
          this.submissions = this.submissions.filter(s => s.id !== subId);
          this.renderTVSubmissions();
        }
      }

      async clearSubmissions() {
        if (this.isOnline && this.db) {
          try {
            const promises = this.submissions.map(s => {
              const docRef = doc(this.db, 'artifacts', appId, 'public', 'data', 'spelling_submissions', s.id);
              return deleteDoc(docRef);
            });
            await Promise.all(promises);
          } catch(e) { console.error("Error clearing submissions:", e); }
        } else {
          this.submissions = [];
          this.renderTVSubmissions();
        }
        this.showToast("Cleared current round submissions!", "info");
      }

      openSpotlight(index) {
        if (index < 0 || index >= this.submissions.length) return;
        this.spotlightIndex = index;
        audio.spotlightChime();

        const sub = this.submissions[index];
        const highlighted = this.highlightWordInText(sub.sentence, this.roomData.activeWord);
        const modal = document.getElementById('modal-content');
        const backdrop = document.getElementById('modal-backdrop');

        modal.innerHTML = `
          <div class="text-center space-y-6 py-4 relative">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <span class="px-4 py-1.5 rounded-full bg-brand-500/20 border border-brand-400 text-brand-300 font-extrabold text-xs uppercase tracking-wider">
                ⭐ TV Presentation Spotlight (${index + 1} / ${this.submissions.length})
              </span>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <!-- Full Screen Large Text Presentation -->
            <div class="py-8 px-4 bg-slate-950/80 rounded-3xl border border-slate-800 shadow-inner">
              <p class="font-display text-3xl sm:text-4xl lg:text-5xl font-black text-white leading-relaxed tracking-wide">
                "${highlighted}"
              </p>
            </div>

            <!-- Spotlight Navigation Controls & Author -->
            <div class="border-t border-slate-800 pt-5 flex flex-wrap items-center justify-between gap-4">
              <div class="flex items-center space-x-3">
                <span class="text-2xl">${sub.avatar || '🦊'}</span>
                <span class="text-lg font-bold text-slate-300">
                  <span class="text-slate-500 font-normal">Author:</span> 
                  <span class="text-brand-300 font-black">${this.roomData.isAnonymous ? 'Secret Wordsmith' : sub.studentName}</span>
                </span>
              </div>

              <!-- Prev / Next & Award Star Controls -->
              <div class="flex items-center space-x-2">
                <button onclick="app.openSpotlight(${index - 1})" ${index === 0 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 bg-slate-800 text-slate-400 font-bold rounded-xl text-sm"' : 'class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition-all"'}>
                  <i class="fa-solid fa-arrow-left mr-1"></i> Prev
                </button>

                <button onclick="app.toggleStarSubmission('${sub.id}', ${!sub.starred})" class="px-4 py-2 bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold rounded-xl shadow transition-all flex items-center space-x-1 text-sm">
                  <i class="fa-solid fa-star"></i>
                  <span>${sub.starred ? 'Starred' : 'Award Star'}</span>
                </button>

                <button onclick="app.openSpotlight(${index + 1})" ${index === this.submissions.length - 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-2 bg-slate-800 text-slate-400 font-bold rounded-xl text-sm"' : 'class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm transition-all"'}>
                  Next <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
              </div>
            </div>
          </div>
        `;

        backdrop.classList.remove('hidden');
        this.triggerConfetti();
      }

      openWordManagerModal() {
        const modal = document.getElementById('modal-content');
        const backdrop = document.getElementById('modal-backdrop');
        
        modal.innerHTML = `
          <div class="space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 class="font-display text-xl font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-list-check text-brand-400"></i>
                <span>Classroom Spelling List Manager</span>
              </h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase mb-1.5">Load Grade Presets</label>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                ${Object.keys(SPELLING_PRESETS).map(key => `
                  <button onclick="app.loadPresetList('${key}')" class="p-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 text-left transition-all">
                    <i class="fa-solid fa-book-bookmark text-brand-400 mr-1"></i> ${key}
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
              <span class="text-xs font-bold uppercase text-amber-400">Add New Custom Spelling Word</span>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input type="text" id="modal-new-word" placeholder="Target Word" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-400">
                <input type="text" id="modal-new-hint" placeholder="Short Hint / Definition" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-brand-400">
              </div>
              <button onclick="app.addCustomWord()" class="w-full py-2 bg-brand-600 hover:bg-brand-500 text-white font-bold text-xs rounded-lg transition-all">
                Add Word to Class List
              </button>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Active Word List (${(this.roomData.wordList || []).length} Words)</label>
              <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
                ${(this.roomData.wordList || []).map((w, idx) => `
                  <div class="p-3 rounded-xl ${w.word.toLowerCase() === this.roomData.activeWord.toLowerCase() ? 'bg-brand-500/20 border-2 border-brand-400' : 'bg-slate-800 border border-slate-700'} flex items-center justify-between">
                    <div>
                      <span class="font-bold text-white text-sm capitalize">${w.word}</span>
                      <p class="text-xs text-slate-400 italic">${w.hint || 'No hint'}</p>
                    </div>
                    <button onclick="app.setWordActive(${idx})" class="px-3 py-1 rounded-lg bg-slate-700 hover:bg-brand-500 text-white font-bold text-xs transition-all">
                      ${w.word.toLowerCase() === this.roomData.activeWord.toLowerCase() ? 'Active Now' : 'Set Active'}
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;

        backdrop.classList.remove('hidden');
      }

      async loadPresetList(key) {
        if (SPELLING_PRESETS[key]) {
          this.roomData.wordList = SPELLING_PRESETS[key];
          this.roomData.currentWordIndex = 0;
          this.roomData.activeWord = SPELLING_PRESETS[key][0].word;
          this.roomData.wordHint = SPELLING_PRESETS[key][0].hint;
          await this.saveRoomData();
          this.renderCurrentMode();
          this.openWordManagerModal();
          this.showToast(`Loaded list: ${key}`, "info");
        }
      }

      async addCustomWord() {
        const wordIn = document.getElementById('modal-new-word');
        const hintIn = document.getElementById('modal-new-hint');
        if (!wordIn) return;

        const word = wordIn.value.trim().toLowerCase();
        const hint = hintIn ? hintIn.value.trim() : '';

        if (!word) return;

        const list = this.roomData.wordList || [];
        list.push({ word, hint });
        this.roomData.wordList = list;

        await this.saveRoomData();
        this.renderCurrentMode();
        this.openWordManagerModal();
        this.showToast(`Added "${word}" to spelling list!`, "success");
      }

      async setWordActive(idx) {
        const list = this.roomData.wordList || [];
        if (list[idx]) {
          this.roomData.currentWordIndex = idx;
          this.roomData.activeWord = list[idx].word;
          this.roomData.wordHint = list[idx].hint || '';
          await this.saveRoomData();
          this.renderCurrentMode();
          this.openWordManagerModal();
          audio.wordChange();
        }
      }

      openPrintSummaryModal() {
        const modal = document.getElementById('modal-content');
        const backdrop = document.getElementById('modal-backdrop');

        modal.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 class="font-display text-xl font-bold text-white flex items-center space-x-2">
                <i class="fa-solid fa-print text-amber-400"></i>
                <span>Printable Class Sentence Summary</span>
              </h3>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white text-lg">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div id="print-area" class="bg-white text-slate-900 p-6 rounded-2xl max-h-96 overflow-y-auto space-y-4">
              <div class="border-b pb-3 flex justify-between items-center">
                <div>
                  <h2 class="text-xl font-bold text-slate-900">Spelling Sentence Showcase Summary</h2>
                  <p class="text-xs text-slate-600">Room: <strong>${this.roomCode}</strong> • Word: <strong class="capitalize">${this.roomData.activeWord}</strong></p>
                </div>
                <span class="text-xs text-slate-500">${new Date().toLocaleDateString()}</span>
              </div>

              <div class="space-y-3">
                ${this.submissions.map((s, idx) => `
                  <div class="p-3 border rounded-xl print-card bg-slate-50">
                    <p class="font-bold text-sm text-slate-800 mb-1">${idx + 1}. ${s.avatar || ''} ${s.studentName} ${s.starred ? '⭐ (Starred)' : ''}</p>
                    <p class="text-base text-slate-900 font-medium">"${s.sentence}"</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2">
              <button onclick="window.print()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-xs rounded-xl shadow">
                <i class="fa-solid fa-print mr-1"></i> Print / Save PDF
              </button>
            </div>
          </div>
        `;

        backdrop.classList.remove('hidden');
      }

      closeModal() {
        document.getElementById('modal-backdrop').classList.add('hidden');
      }

      highlightWordInText(text, targetWord) {
        if (!text || !targetWord) return text || '';
        const escaped = this.escapeRegExp(targetWord.trim());
        const regex = new RegExp(`(\\b${escaped}\\b)`, 'gi');
        return text.replace(regex, `<span class="word-highlight">$1</span>`);
      }

      escapeRegExp(string) {
        return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      speakWord() {
        if ('speechSynthesis' in window && this.roomData.activeWord) {
          const utterance = new SpeechSynthesisUtterance(this.roomData.activeWord);
          utterance.rate = 0.9;
          window.speechSynthesis.speak(utterance);
        }
      }

      triggerConfetti() {
        if (typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }

      showToast(msg, type = "info") {
        const existing = document.getElementById('app-toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.id = 'app-toast';
        toast.className = `fixed bottom-6 right-6 border-2 text-white font-bold text-xs sm:text-sm px-5 py-3 rounded-2xl shadow-2xl z-50 animate-pop-in flex items-center space-x-2 ${type === 'warning' ? 'bg-rose-900 border-rose-500' : type === 'success' ? 'bg-emerald-900 border-emerald-500' : 'bg-slate-800 border-brand-400'}`;
        toast.innerHTML = `<i class="fa-solid fa-circle-info text-brand-400"></i><span>${msg}</span>`;
        document.body.appendChild(toast);

        setTimeout(() => {
          if (toast) toast.remove();
        }, 3200);
      }
    }

    window.app = new SpellingShowcaseApp();

    window.addEventListener('DOMContentLoaded', () => {
      window.app.init();
    });
  </script>
</body>
</html>
